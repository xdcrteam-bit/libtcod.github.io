<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Control Pallet Document | Complete Working System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(145deg, #f0f4fa 0%, #e9eef5 100%); font-family: 'Sarabun', 'Inter', sans-serif; }
  </style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="floating-icon" style="top: 10%; left: 5%; animation-duration: 20s;"><i class="fas fa-pallet"></i></div>
  <div class="floating-icon" style="bottom: 15%; right: 8%; animation-duration: 18s; animation-delay: 2s;"><i class="fas fa-qrcode"></i></div>
  <div class="floating-icon" style="top: 30%; right: 15%; animation-duration: 22s; animation-delay: 1s;"><i class="fas fa-barcode"></i></div>
  <div class="floating-icon" style="bottom: 25%; left: 12%; animation-duration: 25s; animation-delay: 3s;"><i class="fas fa-truck"></i></div>
  <div class="login-card">
    <div class="login-logo"><i class="fas fa-pallet"></i><i class="fas fa-file-alt ms-2"></i></div>
    <h1>Control pallet<br>Document</h1>
    <div class="login-sub">COMPLETE WORKING SYSTEM</div>
    <div class="input-group"><i class="fas fa-user input-icon"></i><input type="text" id="loginUsername" class="login-input" placeholder="ชื่อผู้ใช้งาน"></div>
    <div class="input-group"><i class="fas fa-lock input-icon"></i><input type="password" id="loginPassword" class="login-input" placeholder="รหัสผ่าน"></div>
    <button class="login-btn" id="doLoginBtn"><i class="fas fa-arrow-right-to-bracket"></i> เข้าสู่ระบบ</button>
    <div id="loginError" class="error-msg" style="display:none;"></div>
    <div class="demo-hint"><i class="fas fa-key"></i> admin / admin123 <i class="fas fa-print mx-2"></i> รีปริ้น: กรอกรหัสสาขา → เลื่อนไปรันนิ่ง → กรอกเลข เช่น 001,003-005 → พิมพ์ทันที</div>
  </div>
</div>
<div id="mainApp" style="display:none;"><div id="appRoot"></div></div>
<div id="toastMsg" class="toast"></div>
<div id="printAreaContainer"></div>

<script>
(function(){
  // ---------- core state ----------
  let BRANCH_DB = {};
  let runningSequences = {};
  let printQueue = [];
  let printHistory = [];
  let importedItems = [];
  let isPrinting = false;
  let resetTimeout = null;
  let dailyChart = null, reprintChart = null;
  let autoTimer = null;
  let reprintAutoTimer = null;
  const MAX_HISTORY = 5000;
  
  let fontSizes = { branchCode:3.8, branchAbbr:4.5, branchName:3.4, handwritingLabel:2.4, subItemText:0.9, snText:0.85, timestamp:0.55 };
  let customize = { zoom:1, barcodeWidthMain:2.2, barcodeHeightMain:65, barcodeWidthSub:2.5, barcodeHeightSub:48 };

  function showToast(msg, type='success'){
    let toast = document.getElementById('toastMsg');
    if(!toast) return;
    let icon = type==='success'?'✅':(type==='error'?'❌':'ℹ️');
    toast.innerHTML = `<div style="display:flex; align-items:center; gap:8px;">${icon}<span>${msg}</span></div>`;
    toast.className = `toast show`;
    setTimeout(()=>toast.classList.remove('show'),3000);
  }

  function doLogin(){
    const usernameInput = document.getElementById('loginUsername');
    const passwordInput = document.getElementById('loginPassword');
    const errorSpan = document.getElementById('loginError');
    const user = usernameInput.value.trim();
    const pass = passwordInput.value.trim();
    if(user === 'admin' && pass === 'admin123'){
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      document.getElementById('appRoot').innerHTML = '<div style="padding:2rem">Control Pallet Document loaded.</div>';
      showToast('เข้าสู่ระบบสำเร็จ', 'success');
    } else {
      if(errorSpan){ errorSpan.style.display = 'block'; errorSpan.innerText = '❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (admin / admin123)'; }
      passwordInput.value = '';
      showToast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
    }
  }

  const loginBtn = document.getElementById('doLoginBtn');
  const passwordInput = document.getElementById('loginPassword');
  if(loginBtn) loginBtn.addEventListener('click', doLogin);
  if(passwordInput) passwordInput.addEventListener('keypress', (e)=>{ if(e.key==='Enter') doLogin(); });
})();
</script>
</body>
</html>
